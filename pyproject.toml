[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nokia-yang-mcp"
version = "0.1.0"
description = "Nokia SR OS and SR Linux YANG path support database as an MCP server."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "coolexer"}
]
license = "MIT"
dependencies = [
  "click>=8.1",
  "fastmcp>=4,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.14"
]

[project.scripts]
nokia-yang = "nokia_yang_mcp.cli:main"
nokia-yang-mcp = "nokia_yang_mcp.mcp_server:main"

[tool.setuptools]
packages = ["nokia_yang_mcp", "nokia_yang_mcp.data"]
include-package-data = true

[tool.setuptools.package-data]
nokia_yang_mcp = ["data/*.db.xz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
